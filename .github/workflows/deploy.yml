name: Deploy Django to Private EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Pull latest code from GitHub
        run: |
          cd /home/ubuntu/blog
          git pull origin main

      - name: Rebuild and Restart Docker Container
        run: |
          cd /home/ubuntu/blog
          sudo docker compose up -d --build
