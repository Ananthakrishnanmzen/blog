<!-- Retractable Alpine.js Sidebar -->
<aside class="relative z-20 flex-shrink-0 bg-white dark:bg-zinc-950 border-r border-gray-100 dark:border-gray-800 transition-all duration-300"
       :class="sidebarOpen ? 'w-64' : 'w-20'">
    
    <div class="h-full flex flex-col pt-6 pb-4 overflow-y-auto overflow-x-hidden">
        
        <!-- Toggle Button -->
        <div class="px-4 mb-8 flex items-center justify-between">
            <h2 class="text-xl font-serif font-black text-lightText dark:text-darkText transition-opacity duration-300" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">CONTROL</h2>
            <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg bg-gray-100 dark:bg-zinc-800 text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-darkAccent transition-colors focus:outline-none ml-auto">
                <svg class="w-5 h-5 transform transition-transform duration-300" :class="sidebarOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-3 space-y-2">
            <a href="{% url 'dashboard' %}" class="flex items-center px-3 py-3 rounded-xl transition-all duration-300 group {% if '/dashboard/' == request.path %}bg-primary text-white shadow-lg shadow-primary/30{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 hover:text-primary dark:hover:text-darkAccent{% endif %}">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="ml-4 font-bold text-sm tracking-wide transition-opacity duration-300 whitespace-nowrap" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">Overview</span>
            </a>

            {% if perms.auth.view_user %}
            <a href="{% url 'users' %}" class="flex items-center px-3 py-3 rounded-xl transition-all duration-300 group {% if '/users/' in request.path %}bg-primary text-white shadow-lg shadow-primary/30{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 hover:text-primary dark:hover:text-darkAccent{% endif %}">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="ml-4 font-bold text-sm tracking-wide transition-opacity duration-300 whitespace-nowrap" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">Users</span>
            </a>
            {% endif %}

            <a href="{% url 'categories' %}" class="flex items-center px-3 py-3 rounded-xl transition-all duration-300 group {% if '/categories/' in request.path %}bg-primary text-white shadow-lg shadow-primary/30{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 hover:text-primary dark:hover:text-darkAccent{% endif %}">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                <span class="ml-4 font-bold text-sm tracking-wide transition-opacity duration-300 whitespace-nowrap" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">Categories</span>
            </a>

            <a href="{% url 'posts' %}" class="flex items-center px-3 py-3 rounded-xl transition-all duration-300 group {% if '/posts/' in request.path %}bg-primary text-white shadow-lg shadow-primary/30{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-900 hover:text-primary dark:hover:text-darkAccent{% endif %}">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H14"></path></svg>
                <span class="ml-4 font-bold text-sm tracking-wide transition-opacity duration-300 whitespace-nowrap" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">Posts</span>
            </a>
        </nav>

        <!-- User Actions -->
        <div class="px-3 mt-auto">
            <a href="{% url 'logout' %}" class="flex items-center px-3 py-3 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all duration-300 group">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="ml-4 font-bold text-sm tracking-wide transition-opacity duration-300 whitespace-nowrap" :class="sidebarOpen ? 'opacity-100' : 'opacity-0 hidden'">Logout</span>
            </a>
        </div>
    </div>
</aside>
